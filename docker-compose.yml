# Session 1 development dependency: a local SQL Server for the API to talk to.
#
# This file intentionally contains ONLY the database. Packaging the API itself
# into a container is your work in Session 6 - see docker-compose.todo.yml.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devopslab-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The container is only "healthy" once SQL Server actually answers a query.
      # A running process is not the same thing as a usable dependency - the same
      # distinction you will apply to /healthz/live and /healthz/ready.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
